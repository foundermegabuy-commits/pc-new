<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product | PC House BD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="wrap">
  <nav class="crumb" id="crumb"></nav>
  <div id="pdWrap"></div>

  <section id="relSec">
    <div class="shead">
      <div><h2>Related Products</h2><p>You might also like these</p></div>
      <div class="right">
        <a href="category.html" class="show-all" id="relAll">View All <i class="fa-solid fa-arrow-right"></i></a>
        <button class="nav-arr" data-row="r-rel" data-dir="-1" aria-label="Left"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="nav-arr" data-row="r-rel" data-dir="1" aria-label="Right"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
    <div class="row" id="r-rel"></div>
  </section>

  <section id="recentSec" hidden>
    <div class="shead">
      <div><h2>Recently Viewed</h2><p>Pick up where you left off</p></div>
      <div class="right">
        <button class="nav-arr" data-row="r-recent" data-dir="-1" aria-label="Left"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="nav-arr" data-row="r-recent" data-dir="1" aria-label="Right"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
    <div class="row" id="r-recent"></div>
  </section>
</main>

<div id="site-footer"></div>
<script src="assets/app.js"></script>
<script>
(() => {
  /* ---------- Derived data (kept in sync with category.html) ---------- */
  /* rating & stock come from the shared helpers in app.js so they match cards everywhere */
  const RT = pchRate, RC = pchReviews;
  const stars = r => Array.from({length:5}, (_, k) => r >= k + 1 ? '<i class="fa-solid fa-star"></i>' : r >= k + .5 ? '<i class="fa-solid fa-star-half-stroke"></i>' : '<i class="fa-regular fa-star"></i>').join("");
  const catName = k => CATNAMES[k] || k;
  function rcard(id){
    const s = pchStock(id);
    let h = card(id).replace(/<div class="stock[^"]*">[^<]*<\/div>/, `<div class="stock${s.pre ? " pre" : s.low ? " low" : ""}">${s.text}</div>`);
    if (s.pre) h = h.replace(">Buy Now<", ">Pre-Order<");
    return h;
  }

  /* ---------- Extra gallery images (downloaded from pchouse.com.bd) ---------- */
  const GALLERY = {
    16:["g16-1.jpg","g16-2.png","g16-3.jpg","g16-4.png"],
    15:["g15-1.jpg","g15-2.jpg","g15-3.jpg"],
    17:["g17-1.png","g17-2.png","g17-3.png"]
  };

  /* ---------- Specifications (derived from product names) ---------- */
  const SP = {
    1:{Projector:{"Display Technology":"DLP","Brightness":"500 ANSI Lumens","Native Resolution":"1920 x 1080 (Full HD 1080P)","4K Support":"Yes (decoding)","Screen Size":"40\" – 120\"","Focus":"Auto focus","Keystone":"Auto keystone correction (±40°)"},Smart:{"Operating System":"Android TV (Google certified)","Wi-Fi":"Dual-band Wi-Fi 6","Bluetooth":"5.1"},General:{"Speaker":"2 x 5W","Ports":"HDMI, USB, 3.5mm audio","Weight":"1.3 kg"}},
    2:{Projector:{"Display Technology":"LCD","Brightness":"650 ANSI Lumens","Native Resolution":"1920 x 1080 (Full HD)","Screen Size":"40\" – 150\"","Focus":"Electric focus","Keystone":"Auto keystone"},Smart:{"Operating System":"Android 11","Wi-Fi":"Dual-band Wi-Fi","Bluetooth":"5.0"},General:{"Built-in Battery":"Yes, outdoor ready","Speaker":"10W","Ports":"HDMI, USB, AUX"}},
    3:{Display:{"Screen Size":"34 inch","Panel Type":"VA, Curved 1500R","Resolution":"3440 x 1440 (UWQHD)","Aspect Ratio":"21:9","Refresh Rate":"180Hz","Response Time":"1ms (MPRT)","HDR":"HDR10","Color Gamut":"95% DCI-P3","Adaptive Sync":"AMD FreeSync Premium"},Connectivity:{"Ports":"2 x HDMI 2.0, 2 x DisplayPort 1.4, 3.5mm audio out"},General:{"Stand":"Tilt & height adjustable","VESA Mount":"100 x 100 mm","Model Year":"2026"}},
    4:{Display:{"Screen Size":"49 inch","Panel Type":"VA, Curved 1800R","Resolution":"3840 x 1080 (Dual FHD)","Aspect Ratio":"32:9","Refresh Rate":"144Hz","Response Time":"1ms (MPRT)","HDR":"HDR10","Adaptive Sync":"AMD FreeSync Premium"},Connectivity:{"Ports":"2 x HDMI 2.0, 1 x DisplayPort 1.4, USB 3.2 hub, audio out"},General:{"Series":"AOC AGON","Stand":"Height, tilt & swivel adjustable","VESA Mount":"100 x 100 mm"}},
    5:{Wheel:{"Feedback":"TRUEFORCE high-definition force feedback","Rotation":"900°","Rim":"Hand-stitched leather","Controls":"Dual clutch, 24-point selection dial, RPM LEDs"},Pedals:{"Pedal Set":"3 pedals with progressive brake spring"},General:{"Compatibility":"PC, PlayStation 5, PlayStation 4","Connection":"USB","Mounting":"Integrated table clamps"}},
    6:{Keyboard:{"Layout":"87 keys (TKL)","Switch":"Magnetic Hall-effect switches","Rapid Trigger":"Yes, 0.1mm adjustable actuation","Polling Rate":"8000Hz","Keycaps":"Double-shot PBT","Backlight":"Per-key RGB"},General:{"Connectivity":"Wired USB Type-C","Software":"Web driver support","Compatibility":"Windows, macOS"}},
    7:{Keyboard:{"Layout":"87 keys (TKL)","Structure":"Gasket mount","Hot-swappable":"Yes, 3/5-pin","Switch":"Linear mechanical switches","Keycaps":"PBT","Backlight":"RGB"},General:{"Connectivity":"Wired USB Type-C","Polling Rate":"1000Hz","Compatibility":"Windows, macOS"}},
    8:{Mouse:{"Sensor":"PixArt PAW3395","DPI":"Up to 26,000","Polling Rate":"1000Hz","Buttons":"6 programmable","Weight":"Approx. 59 g"},Connectivity:{"Mode":"2.4GHz wireless / wired USB-C","Battery":"500mAh rechargeable"},General:{"Compatibility":"Windows, macOS"}},
    9:{Mouse:{"Sensor":"PixArt PAW3395","DPI":"Up to 26,000","Polling Rate":"1000Hz (4K with dongle)","Switches":"Optical micro switches","Weight":"Approx. 55 g"},Connectivity:{"Mode":"Tri-mode: 2.4GHz / Bluetooth / wired","Battery":"Up to 80 hours"},General:{"Compatibility":"Windows, macOS, Android"}},
    10:{Display:{"Screen Size":"27 inch","Panel Type":"Fast IPS","Resolution":"2560 x 1440 (2K QHD)","Refresh Rate":"200Hz","Response Time":"1ms (GtG)","HDR":"HDR10","Color Gamut":"95% DCI-P3","Adaptive Sync":"FreeSync / G-Sync compatible"},Connectivity:{"Ports":"2 x HDMI 2.0, 1 x DisplayPort 1.4, audio out"},General:{"Stand":"Tilt adjustable","VESA Mount":"75 x 75 mm"}},
    11:{Processor:{"CPU":"AMD Ryzen 5 7500F (6 cores, 12 threads, up to 5.0GHz)","CPU Cooler":"Tower air cooler, ARGB"},Platform:{"Motherboard":"AMD B650M chipset, DDR5","Memory":"16GB DDR5 5600MHz","Storage":"512GB PCIe 4.0 NVMe M.2 SSD"},Graphics:{"Graphics Card":"NVIDIA GeForce RTX 5060 8GB GDDR7"},General:{"Power Supply":"650W 80+ Bronze","Casing":"Mid-tower ARGB gaming case","Operating System":"Not included"}},
    12:{Processor:{"CPU":"AMD Ryzen 7 7700 (8 cores, 16 threads, up to 5.3GHz)","CPU Cooler":"AMD Wraith Prism (included)"},Platform:{"Motherboard":"AMD A620M chipset, DDR5","Memory":"16GB DDR5 5200MHz","Storage":"512GB PCIe NVMe M.2 SSD"},Graphics:{"Graphics":"AMD Radeon integrated graphics"},General:{"Power Supply":"550W","Casing":"Micro-ATX case","Operating System":"Not included"}},
    13:{Processor:{"CPU":"Intel Core i5-14600K (14 cores, 20 threads, up to 5.3GHz)","CPU Cooler":"240mm ARGB liquid cooler (white)"},Platform:{"Motherboard":"Intel B760M Wi-Fi (white), DDR5","Memory":"16GB DDR5 6000MHz (white)","Storage":"1TB PCIe 4.0 NVMe M.2 SSD"},Graphics:{"Graphics Card":"Intel Arc B580 12GB GDDR6"},General:{"Power Supply":"750W 80+ Gold","Casing":"White dual-chamber ARGB case","Operating System":"Not included"}},
    14:{Processor:{"CPU":"AMD Ryzen 5 PRO 5650G (6 cores, 12 threads, up to 4.4GHz)","CPU Cooler":"AMD stock cooler"},Platform:{"Motherboard":"AMD A520M chipset, DDR4","Memory":"16GB DDR4 3200MHz","Storage":"256GB NVMe M.2 SSD"},Graphics:{"Graphics":"AMD Radeon Vega 7 integrated graphics"},General:{"Power Supply":"450W","Casing":"Micro-ATX case","Operating System":"Not included"}},
    15:{Processor:{"CPU":"AMD Ryzen 7 6800H (8 cores, 16 threads, up to 4.7GHz)"},Display:{"Size":"15.6 inch","Resolution":"1920 x 1080 (FHD)","Panel":"IPS-level, 144Hz, Adaptive-Sync"},Memory:{"RAM":"8GB DDR5 4800MHz (up to 32GB)","Storage":"1TB PCIe 4.0 NVMe M.2 SSD"},Graphics:{"GPU":"NVIDIA GeForce RTX 3050 4GB GDDR6"},General:{"Operating System":"Windows 11 Home","Battery":"90WHrs, 4-cell Li-ion","Weight":"2.10 kg","Keyboard":"Backlit chiclet, RGB"}},
    16:{Processor:{"CPU":"Intel Core i7-12700H (14 cores, 20 threads, up to 4.7GHz, 24MB cache)"},Display:{"Size":"15.6 inch","Resolution":"1920 x 1080 (FHD)","Panel":"IPS-level, 144Hz, 250 nits"},Memory:{"RAM":"8GB DDR4 3200MHz (up to 32GB)","Storage":"512GB PCIe 4.0 NVMe M.2 SSD"},Graphics:{"GPU":"NVIDIA GeForce RTX 3050 4GB GDDR6"},General:{"Operating System":"Windows 11 Home","Battery":"90WHrs, 4-cell Li-ion","Weight":"2.20 kg","Keyboard":"Backlit chiclet, RGB","Durability":"MIL-STD-810H"}},
    17:{Processor:{"CPU":"AMD Ryzen 7 6800HS (8 cores, 16 threads, up to 4.7GHz)"},Display:{"Size":"15.6 inch","Resolution":"1920 x 1080 (FHD)","Panel":"IPS-level, 144Hz"},Memory:{"RAM":"8GB DDR5 4800MHz (up to 32GB)","Storage":"512GB PCIe 4.0 NVMe M.2 SSD"},Graphics:{"GPU":"NVIDIA GeForce RTX 2050 4GB GDDR6"},General:{"Operating System":"Windows 11 Home","Battery":"90WHrs, 4-cell Li-ion","Weight":"2.20 kg","Durability":"MIL-STD-810H"}},
    18:{Processor:{"CPU":"Intel Core i5-13420H (8 cores, 12 threads, up to 4.6GHz)"},Display:{"Size":"15.6 inch","Resolution":"1920 x 1080 (FHD)","Panel":"IPS, 144Hz, 250 nits"},Memory:{"RAM":"8GB DDR4 3200MHz","Storage":"512GB PCIe NVMe M.2 SSD"},Graphics:{"GPU":"NVIDIA GeForce RTX 3050 6GB GDDR6"},General:{"Operating System":"Windows 11 Home","Battery":"70WHrs, 4-cell","Weight":"2.29 kg"}},
    19:{Display:{"Size":"12.7 inch","Panel":"IPS","Resolution":"2176 x 1600 (2.2K)"},Performance:{"Processor":"MediaTek Helio G99 octa-core","RAM":"8GB","Storage":"128GB (microSD expandable)"},Connectivity:{"Network":"4G LTE dual SIM","Wi-Fi":"Dual-band Wi-Fi","Bluetooth":"5.0"},General:{"Operating System":"Android 14","Battery":"8000mAh","Stylus":"Pen support"}},
    20:{Display:{"Screen Size":"15.6 inch","Panel":"IPS, 10-point touch","Resolution":"1920 x 1080 (FHD)","Refresh Rate":"60Hz","Brightness":"300 nits"},Connectivity:{"Ports":"2 x USB Type-C (full function), 1 x Mini HDMI"},General:{"Weight":"Approx. 0.8 kg","Included":"Smart cover stand, USB-C & HDMI cables"}}
  };
  const GICON = {Processor:"fa-microchip",Display:"fa-display",Memory:"fa-memory",Graphics:"fa-gamepad",General:"fa-circle-info",Platform:"fa-server",Connectivity:"fa-plug",Projector:"fa-video",Smart:"fa-robot",Keyboard:"fa-keyboard",Mouse:"fa-computer-mouse",Wheel:"fa-circle-dot",Pedals:"fa-shoe-prints",Performance:"fa-gauge-high",Warranty:"fa-shield-halved"};
  const WARR = {laptop:"2 Years",desktop:"3 Years (parts as per brand)",monitor:"3 Years",projector:"1 Year",accessories:"1 Year",gaming:"1 Year",tablet:"1 Year"};

  /* ---------- Resolve product ---------- */
  let id = +qp("id") || 16;
  const x = P[id];
  if (!x) {
    $("#crumb").innerHTML = `<a href="index.html">Home</a><i class="fa-solid fa-chevron-right"></i><span>Product not found</span>`;
    $("#pdWrap").innerHTML = `<div class="box empty" id="notFound"><i class="fa-solid fa-box-open"></i><h3>Product not found</h3><p>The product you're looking for doesn't exist or is no longer available.</p><a href="category.html" class="btn primary" style="margin-top:18px">Browse all products</a></div>`;
    $("#recentSec").hidden = true;
    fill("r-rel", Object.keys(P).slice(0, 10));
    return;
  }

  document.title = x.n + " | PC House BD";
  $$("nav.cats a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "category.html?c=" + x.c));
  const save = x.o - x.p, pct = Math.round(save / x.o * 100);
  const sku = "PCH-" + x.c.slice(0, 3).toUpperCase() + "-" + String(id).padStart(4, "0");
  const imgs = [x.i, ...(GALLERY[id] || [])];
  const spec = SP[id] || {General:{}};
  const warranty = WARR[x.c] || "1 Year";
  const allSpec = Object.assign({}, ...Object.values(spec));
  const model = x.n.replace(new RegExp("^" + x.b.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*", "i"), "");

  // Key features: first 5 spec rows across groups
  const kf = Object.entries(allSpec).slice(0, 5);
  const stk = pchStock(id);
  const avail = stk.pre ? `<span class="pill warn"><i class="fa-solid fa-clock"></i>Pre-Order</span>`
    : stk.low ? `<span class="pill bad"><i class="fa-solid fa-fire"></i>${esc(stk.text)}</span>`
    : `<span class="pill ok"><i class="fa-solid fa-circle-check"></i>In Stock</span>`;
  const viewers = 6 + (id * 13) % 23;
  const urgency = stk.pre
    ? `<div class="preinfo"><i class="fa-solid fa-circle-info"></i><span><b>Pre-order item.</b> Book now and get it in 7–10 working days. Only a small advance is needed; the rest is paid on delivery.</span></div>`
    : "";
  const waText = `Hi PC House, I'm interested in: ${x.n} (${tk(x.p)}) – ${location.href}`;

  /* ---------- Bundle: product + 2 complementary items ---------- */
  const ACC_PAIR = {6:[9,8], 7:[8,9], 8:[7,6], 9:[6,7]};
  const CAT_PAIR = {laptop:[8,7], monitor:[9,6], desktop:[10,7], gaming:[6,9], tablet:[9,7]};
  const bIds = [id, ...(ACC_PAIR[id] || CAT_PAIR[x.c] || [8,7]).filter(k => P[k] && k !== id).slice(0, 2)];

  /* ---------- Branch availability (deterministic mock) ---------- */
  function branchAvail(bi){
    if (bi === 3) return null; // Service Center & RMA doesn't sell stock
    if (stk.pre) return bi === 0 ? {c:"warn", t:"Pre-order"} : bi === 1 ? {c:"bad", t:"Not available"} : null;
    if (bi === 0) return stk.low ? {c:"warn", t:"Only " + stk.left + " left"} : {c:"ok", t:"In stock"};
    if (bi === 1) return id % 4 === 1 ? {c:"bad", t:"Out of stock"} : (stk.low || id % 2) ? {c:"warn", t:"Limited"} : {c:"ok", t:"In stock"};
    return ["laptop", "desktop", "monitor"].includes(x.c) ? {c:"info", t:"Display only"} : null;
  }
  const branchRows = BRANCHES.map((b, bi) => [b, branchAvail(bi)]).filter(r => r[1]).map(([b, a]) => {
    const st = branchStatus(b);
    return `<div class="bs-row"><div><b class="bs-name"><i class="fa-solid ${b.icon}"></i>${esc(b.name)}</b><span class="bs-open ${st.open ? "on" : ""}">${esc(st.text)}</span></div><span class="pill ${a.c}">${a.t}</span><a class="bs-dir" href="https://maps.google.com/?q=${encodeURIComponent(b.map)}" target="_blank" rel="noopener"><i class="fa-solid fa-diamond-turn-right"></i>Directions</a></div>`;
  }).join("");

  /* ---------- Reviews / Q&A data ---------- */
  const avg = RT(id), cnt = RC(id);
  const dist = (() => { const w5 = Math.round((avg - 4) * 100), r = 100 - w5; return [w5, Math.round(r * .7), Math.round(r * .2), Math.round(r * .07), Math.max(0, r - Math.round(r * .7) - Math.round(r * .2) - Math.round(r * .07))]; })();
  const SAMPLE = [
    {n:"Tanvir Ahmed", r:5, d:"12 Sep 2026", t:`Got the ${esc(model.split(" ").slice(0, 3).join(" "))} from the Multiplan showroom. 100% original with official warranty and the staff helped me test everything before I left. Highly recommended!`, ph:imgs.slice(0, 3).reverse().map(s => "img/" + s)},
    {n:"Nusrat Jahan", r:5, d:"28 Aug 2026", t:`Delivered to Chattogram in two days, packaging was excellent. Performance is exactly what I expected for the price. Great value from ${esc(x.b)}.`},
    {n:"Rafiul Islam", r:4, d:"03 Aug 2026", t:`Very happy with the build quality and features. Took one star because I wish the box included a few more accessories, but PC House support was quick to answer my questions.`}
  ];
  const userRevs = store.get("reviews", {})[id] || [];
  const CATQ = {
    laptop:["Can I upgrade the RAM and storage later?","Yes. This laptop has an accessible SO-DIMM slot and an additional M.2 slot on most configurations. Our service team can upgrade it for you in-store without voiding the warranty."],
    desktop:["Is Windows pre-installed on this build?","The build ships without an OS by default. We can install a genuine Windows license on request at an extra cost; just mention it while ordering."],
    monitor:["Which cables come in the box?","A power adapter and a DisplayPort or HDMI cable are included in the box. Additional cables are available in our accessories section."],
    projector:["Can I use it in a bright room?","For the best picture we recommend a dim room. In daylight it works fine for casual use at a smaller screen size."],
    accessories:["Does it work with Mac?","Yes, it works with macOS out of the box. Some software features may only be available on Windows."],
    gaming:["Does it work with Xbox?","This version supports PC and PlayStation. An Xbox-specific version is available on request."],
    tablet:["Can I make phone calls with this tablet?","Yes, with a 4G LTE SIM inserted you can make calls and use mobile data."]
  };
  const QA = [
    CATQ[x.c] || ["Is this product available in the showroom?","Yes, you can check it at our Multiplan Center showroom."],
    ["Is this the original product with official warranty?",`Yes, every product we sell is 100% original and comes with ${warranty.toLowerCase()} official warranty from ${esc(x.b)} or its authorised distributor.`],
    ["Is 0% EMI available for this product?",`Yes, 0% EMI is available for up to 12 months with selected bank credit cards, starting from ${tk(Math.ceil(x.p / 12))}/month.`],
    ["How long does delivery take outside Dhaka?","Delivery outside Dhaka usually takes 2–3 working days via courier. Inside Dhaka we deliver within 24 hours."]
  ];

  /* only accept our own downscaled JPEG data URLs or local img/ paths */
  const safePh = a => (Array.isArray(a) ? a : []).filter(s => typeof s === "string" && (/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s) || /^img\/[\w.-]+$/.test(s))).slice(0, 4);
  const revHTML = r => { const ph = safePh(r.ph); return `<div class="rvw"><div class="av">${esc(r.n.split(" ").map(s => s[0]).join("").slice(0, 2).toUpperCase())}</div><div style="flex:1;min-width:0">
      <div class="hd"><b>${esc(r.n)}</b><span class="pill ok"><i class="fa-solid fa-circle-check"></i>Verified Buyer</span><time>${esc(r.d)}</time></div>
      <div class="rating" style="margin-top:4px">${stars(r.r)}</div>
      <p>${r.t}</p>
      ${ph.length ? `<div class="rv-ph">${ph.map((s, k) => `<button type="button" data-lb="${k}" aria-label="View photo ${k + 1}"><img src="${s}" alt="Review photo ${k + 1}" loading="lazy"></button>`).join("")}</div>` : ""}
      <div class="helpful"><button onclick="this.innerHTML='<i class=\\'fa-solid fa-thumbs-up\\'></i> Thanks for your feedback';this.disabled=true"><i class="fa-regular fa-thumbs-up"></i>Helpful</button></div>
    </div></div>`; };

  /* ---------- Render ---------- */
  $("#crumb").innerHTML = `<a href="index.html"><i class="fa-solid fa-house" style="font-size:11px;opacity:1"></i> Home</a><i class="fa-solid fa-chevron-right"></i><a href="category.html?c=${x.c}">${esc(catName(x.c))}</a><i class="fa-solid fa-chevron-right"></i><a href="category.html?c=${x.c}&q=${encodeURIComponent(x.b)}">${esc(x.b)}</a><i class="fa-solid fa-chevron-right"></i><span>${esc(model.length > 48 ? model.slice(0, 48) + "…" : model)}</span>`;
  $("#relAll").href = "category.html?c=" + x.c;

  $("#pdWrap").innerHTML = `
  <div class="pd">
    <div class="gallery">
      <div class="gmain" id="gmain">
        <div class="badges">${save > 0 ? `<span class="save">-${pct}% OFF</span>` : ""}${id === 16 ? `<span class="tag">HOT DEAL</span>` : ""}</div>
        <img src="img/${imgs[0]}" alt="${esc(x.n)}" id="gimg">
        ${imgs.length > 1 ? `<button class="garr p" aria-label="Previous image"><i class="fa-solid fa-chevron-left"></i></button><button class="garr n" aria-label="Next image"><i class="fa-solid fa-chevron-right"></i></button>` : ""}
        <span class="hint"><i class="fa-solid fa-magnifying-glass-plus"></i>Hover to zoom</span>
      </div>
      <div class="gthumbs" id="gthumbs">${(imgs.length > 1 ? imgs : [x.i, x.i, x.i]).map((s, k) => `<button class="${k ? "" : "on"}" data-k="${k}" aria-label="Image ${k + 1}"><img src="img/${s}" alt=""></button>`).join("")}</div>
    </div>

    <div class="info">
      <div class="top"><a class="bchip" href="category.html?q=${encodeURIComponent(x.b)}"><i class="fa-solid fa-certificate"></i>${esc(x.b)}</a>${avail}</div>
      <h1>${esc(x.n)}</h1>
      <div class="meta">
        <span class="rating">${stars(avg)}<span><b>${avg.toFixed(1)}</b> (${cnt + userRevs.length} reviews)</span></span>
        <span class="sep"></span>
        <a href="#tabs" data-go="qa"><i class="fa-regular fa-comments"></i> ${QA.length} Questions</a>
        <span class="sep"></span>
        <span>SKU: <b>${sku}</b></span>
      </div>

      <div class="pbox">
        <div class="now"><b>${tk(x.p)}</b>${x.o > x.p ? `<s>${tk(x.o)}</s><span class="save">SAVE ${tk(save)}</span>` : ""}</div>
        <div class="emi"><i class="fa-solid fa-credit-card"></i><span>0% EMI from <b>${tk(Math.ceil(x.p / 12))}/month</b> for 12 months</span><a href="#" onclick="emiCalc(${id});return false">EMI Calculator</a></div>
      </div>
      ${urgency}

      <div class="kf">
        <h3>Key Features</h3>
        <ul>${kf.map(([k, v]) => `<li><i class="fa-solid fa-check"></i><span><b>${esc(k)}:</b> ${esc(v)}</span></li>`).join("")}</ul>
        <a class="more" data-go="spec">View full specification <i class="fa-solid fa-arrow-down"></i></a>
      </div>

      <div class="buyrow">
        <div class="qty"><button aria-label="Decrease" id="qm"><i class="fa-solid fa-minus"></i></button><input id="pq" value="1" inputmode="numeric" aria-label="Quantity"><button aria-label="Increase" id="qpBtn"><i class="fa-solid fa-plus"></i></button></div>
        <button class="icon-btn" data-wish="${id}" aria-label="Add to wishlist" onclick="toggleWish(${id})"><i class="fa-regular fa-heart"></i></button>
        <button class="icon-btn" data-cmp="${id}" aria-label="Add to compare" onclick="toggleCompare(${id})"><i class="fa-solid fa-code-compare"></i></button>
        <button class="btn dark" id="addBtn"><i class="fa-solid fa-cart-plus"></i>Add to Cart</button>
        <button class="btn primary" id="buyBtn"><i class="fa-solid fa-bolt"></i>${stk.pre ? "Pre-Order" : "Buy Now"}</button>
      </div>
      <div class="buy2">
        ${stk.pre ? `<button class="btn notify" id="notifyBtn" type="button"><i class="fa-regular fa-bell"></i>Notify me when available</button>` : ""}
        <a class="btn wa" href="https://wa.me/8801322928226?text=${encodeURIComponent(waText)}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i>Ask on WhatsApp</a>

  let rPh = [];

  const downscale = file => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const s = Math.min(1, 400 / Math.max(im.width, im.height)), cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(im.width * s)); cv.height = Math.max(1, Math.round(im.height * s));
        const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/jpeg", .72));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);

  ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("drag"); }));
  ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("drag"); }));
  drop.addEventListener("drop", e => addPhotos(e.dataTransfer.files));
  $("#rprev").addEventListener("click", e => { const b = e.target.closest("[data-rm]"); if (b) { rPh.splice(+b.dataset.rm, 1); renderPh(); } });

  /* ---------- Review form ---------- */
  let pick = 0;
  const LABELS = ["", "Poor", "Fair", "Good", "Very good", "Excellent"];
  const paint = n => $$("#starpick button").forEach(b => b.classList.toggle("on", +b.dataset.s <= n));
  $("#starpick").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; pick = +b.dataset.s; paint(pick); $("#starTxt").textContent = LABELS[pick]; });
  $("#starpick").addEventListener("mouseover", e => { const b = e.target.closest("button"); if (b) paint(+b.dataset.s); });
  $("#starpick").addEventListener("mouseleave", () => paint(pick));
  $("#rform").addEventListener("submit", e => {
    e.preventDefault();
    if (!pick) { toast("Please select a star rating"); return; }
    const r = {n:$("#rn").value.trim(), r:pick, d:new Date().toLocaleDateString("en-GB", {day:"2-digit", month:"short", year:"numeric"}), t:esc($("#rt").value.trim())};
    if (rPh.length) r.ph = rPh.slice();
    const all = store.get("reviews", {}); all[id] = [r, ...(all[id] || [])]; store.set("reviews", all);
    let msg = "Thanks! Your review has been posted";
    if (r.ph && (store.get("reviews", {})[id] || []).length !== all[id].length) { // storage full: keep the review, drop the photos
      delete r.ph; store.set("reviews", all); msg = "Review posted, but photos were too large to save";
    }
    revs.unshift(r); rf = "all"; renderRevs();
    const total = cnt + all[id].length;
    $("#revN").textContent = total; $("#revBase").textContent = `Based on ${total} reviews`;
    e.target.reset(); pick = 0; paint(0); $("#starTxt").textContent = "Select a rating";
    rPh = []; renderPh();
    toast(msg);
    $("#revList").scrollIntoView({behavior:"smooth", block:"start"});
  });
  $("#askf").addEventListener("submit", e => {
    e.preventDefault();
    const q = $("#askq").value.trim();
    $("#qaList").insertAdjacentHTML("afterbegin", `<details class="qa" open><summary><span class="q">Q</span><span>${esc(q)}</span><i class="fa-solid fa-chevron-down chev"></i></summary><div class="a"><span class="q" style="background:#FFF4E0;color:#C77700"><i class="fa-regular fa-clock"></i></span><div>Thanks for asking! Our team will answer within 24 hours.<small>Pending answer</small></div></div></details>`);
    $("#qaN").textContent = +$("#qaN").textContent + 1;
    e.target.reset(); toast("Your question has been submitted");
  });

  /* ---------- Side: more from brand ---------- */
  const ids = Object.keys(P).map(Number).filter(k => k !== id);
  let brandIds = ids.filter(k => P[k].b === x.b);
  if (brandIds.length < 3) brandIds = [...brandIds, ...ids.filter(k => P[k].c === x.c && !brandIds.includes(k))];
  if (brandIds.length < 3) brandIds = [...brandIds, ...ids.filter(k => !brandIds.includes(k))];
  $("#minis").innerHTML = brandIds.slice(0, 4).map(k => `<a class="mini" href="product.html?id=${k}"><img src="img/${P[k].i}" alt=""><div><b>${esc(P[k].n)}</b><span>${tk(P[k].p)}</span></div></a>`).join("");

  /* ---------- Related & recent ---------- */
  let rel = ids.filter(k => P[k].c === x.c);
  if (rel.length < 6) rel = [...rel, ...ids.filter(k => !rel.includes(k)).sort((a, b) => Math.abs(P[a].p - x.p) - Math.abs(P[b].p - x.p))].slice(0, 8);
  $("#r-rel").innerHTML = rel.map(rcard).join("");

  const recent = store.get("recent", []).map(Number).filter(k => k !== id && P[k]);
  if (recent.length) { $("#recentSec").hidden = false; $("#r-recent").innerHTML = recent.slice(0, 10).map(rcard).join(""); }
  store.set("recent", [id, ...recent].slice(0, 12));

  markTools();
})();
</script>
</body>
</html>
